<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kuhu — power cut notices</title>
<meta name="theme-color" content="#0c0f0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f5ef" media="(prefers-color-scheme: light)">
<meta name="description" content="Quiet notifications before a power cut, for the areas you choose.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <img src="/icon.svg" alt="" aria-hidden="true">
    <b>kuhu</b>
    <span class="beta">beta</span>
    <div class="mast-controls">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true" aria-label="English" title="English">EN</button>
        <button type="button" data-lang="hi" aria-pressed="false" aria-label="हिंदी" title="हिंदी">हिं</button>
      </div>
      <button id="theme" class="theme-btn" type="button" aria-label="Theme"><span class="theme-icon" aria-hidden="true">◐</span></button>
    </div>
  </header>

  <h1 data-s="sub_title">Know before the power goes.</h1>
  <p class="lede" data-s="sub_lede"></p>

  <div id="flash" class="flash hidden" role="status"></div>

  <h2 data-s="your_areas">Your areas</h2>
  <!-- subscribe.js builds its own .chips groups inside, one per service -->
  <div id="regions"></div>

  <p style="margin-top:1.4rem">
    <button id="notify" class="big" type="button" data-s="notify_me">Notify me</button>
  </p>

  <h2 data-s="upcoming">Coming up</h2>
  <div id="upcoming"></div>

  <!-- ============ OTHER WAYS TO HEAR ============ -->
  <section class="ways">
    <h2 data-s="other_ways">Other ways to know</h2>

    <a class="way" href="https://t.me/kuhunotices" target="_blank" rel="noopener">
      <strong><span class="tg" aria-hidden="true">✈</span><span data-s="tg_join">Join the Telegram channel</span></strong>
      <p data-s="tg_note"></p>
    </a>

    <details class="acc">
      <summary><span class="acc-title" data-s="devices_title">For devices and tinkerers</span></summary>
      <div class="acc-body">
        <p class="hint-p" data-s="devices_note"></p>
        <p><code>kuhu/&lt;area&gt;/cuts</code></p>
        <p><a id="api-example" href="/api/regions" target="_blank" rel="noopener" data-s="devices_api">See the JSON for an area</a></p>
      </div>
    </details>
  </section>


  <div class="support">
    <p data-s="support_note"></p>
    <a href="https://buymeachai.ezee.li/anishmg" target="_blank" rel="noopener" data-s="support_chai">☕ Buy me a chai</a>
    <a href="https://ko-fi.com/P5P7BMO10" target="_blank" rel="noopener" data-s="support_kofi">♥ Ko-fi</a>
  </div>

  <div class="foot">
    <span id="version" class="version"></span>
    <a href="/post" data-s="post_link">Team login</a>
    <a href="https://kuhu.starstucklab.com">kuhu.starstucklab.com</a>
  </div>

</div>
<script type="module" src="/subscribe.js"></script>
</body>
</html>
