<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kuhu — join your team</title>
<meta name="theme-color" content="#0c0f0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f5ef" media="(prefers-color-scheme: light)">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <img src="/icon.svg" alt="" aria-hidden="true">
    <b>kuhu</b>
    <span class="beta">beta</span>
    <div class="mast-controls">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true" aria-label="English" title="English">EN</button>
        <button type="button" data-lang="hi" aria-pressed="false" aria-label="हिंदी" title="हिंदी">हिं</button>
      </div>
      <button id="theme" class="theme-btn" type="button" aria-label="Theme"><span class="theme-icon" aria-hidden="true">◐</span></button>
    </div>
  </header>

  <div id="flash" class="flash hidden" role="status"></div>

  <!-- link is being checked -->
  <section id="checking">
    <p class="empty" data-s="checking">Checking the link…</p>
  </section>

  <!-- link is no good -->
  <section id="dead" class="hidden">
    <h1 data-s="link_dead_title">This link no longer works.</h1>
    <p class="lede" data-s="link_dead_body"></p>
  </section>

  <!-- paste fallback: for when a link cannot be tapped in the right place -->
  <section id="paste-box" class="panel">
    <h3 data-s="paste_title">Have a link?</h3>
    <p class="hint-p" data-s="paste_help"></p>
    <label class="field">
      <input id="paste" autocapitalize="none" spellcheck="false" enterkeyhint="go">
    </label>
    <button id="paste-go" class="big ghost" type="button" data-s="paste_go">Continue</button>
  </section>

  <!-- link is good -->
  <section id="ok" class="hidden">
    <h1 id="invite-head"></h1>
    <p class="lede" id="invite-lede"></p>

    <!-- iOS: the Home Screen app has its own sign-in, separate from Safari -->
    <div id="ios-warn" class="warnbox hidden">
      <strong id="ios-warn-title">Using an iPhone?</strong>
      <p id="ios-warn-body"></p>
      <button id="ios-copy" class="big" type="button" data-s="ios_copy">Copy this link</button>
      <button id="ios-go" class="big ghost" type="button">Continue anyway</button>
    </div>

    <div id="new-fields">
      <label class="field">
        <span data-s="your_name">Your name</span>
        <input id="name" autocomplete="name" enterkeyhint="done">
      </label>

      <label class="field">
        <span data-s="your_phone">Phone number (optional)</span>
        <input id="phone" type="tel" autocomplete="tel" inputmode="tel">
      </label>
    </div>

    <button id="join" class="big" type="button" data-s="join">Join</button>
  </section>

  <div class="foot">
    <span id="version" class="version"></span>
    <a href="/" data-s="subscribe_link">Subscribe instead</a>
  </div>

</div>
<script type="module" src="/join.js"></script>
</body>
</html>
