<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kuhu — post a notice</title>
<meta name="theme-color" content="#0c0f0c">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <img src="/icon.svg" alt="" aria-hidden="true">
    <b>kuhu</b>
    <span class="beta">beta</span>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">English</button>
      <button type="button" data-lang="hi" aria-pressed="false">हिंदी</button>
    </div>
  </header>

  <div id="flash" class="flash hidden" role="status"></div>

  <!-- ============ NOT SIGNED IN ============ -->
  <section id="join-view">
    <h1 data-s="join_title">Join your team</h1>
    <p class="lede" data-s="join_by_link"></p>

    <!-- The fallback that makes an installed app usable: paste the link the
         admin sent, or one you made on another phone. -->
    <div class="panel">
      <h3 data-s="paste_title">Have a link?</h3>
      <p class="hint-p" data-s="paste_help"></p>
      <label class="field">
        <input id="paste" autocapitalize="none" spellcheck="false" enterkeyhint="go">
      </label>
      <button id="paste-go" class="big" type="button" data-s="paste_go">Continue</button>
    </div>
  </section>

  <!-- ============ POST ============ -->
  <section id="post-view" class="hidden">
    <h1 data-s="post_title">Post a notice.</h1>
    <p class="lede" data-s="post_lede"></p>

    <h2 data-s="area">Area</h2>
    <div id="areas" class="chips"></div>

    <h2 data-s="kind">Kind</h2>
    <div id="kinds" class="chips"></div>

    <h2 data-s="when">When</h2>
    <div id="quick" class="chips" style="margin-bottom:1rem"></div>
    <label class="field">
      <span data-s="starts">Starts</span>
      <input id="from" type="datetime-local">
    </label>
    <label class="field">
      <span data-s="ends">Ends</span>
      <input id="to" type="datetime-local">
    </label>

    <h2 data-s="reason">Reason</h2>
    <div id="reasons" class="chips" style="margin-bottom:1rem"></div>
    <label class="field">
      <span data-s="reason_other">Or write it yourself</span>
      <textarea id="reason-free" rows="2"></textarea>
    </label>

    <button id="publish" class="big" type="button" data-s="publish">Publish notice</button>

    <h2 data-s="your_notices">Your recent notices</h2>
    <div id="mine"></div>

    <!-- ============ ADMIN (role=admin only) ============ -->
    <section id="admin-view" class="hidden">
      <h2 data-s="admin">Admin</h2>

      <div class="panel">
        <h3 data-s="invite_someone">Invite someone</h3>
        <label class="field">
          <span data-s="invite_as">Joining as</span>
          <div id="invite-role" class="chips"></div>
        </label>
        <label class="field">
          <span data-s="invite_note">Note to yourself (optional)</span>
          <input id="invite-note">
        </label>
        <label class="field">
          <span data-s="invite_valid">Link works for</span>
          <div id="invite-hours" class="chips"></div>
        </label>
        <button id="make-invite" class="big" type="button" data-s="make_link">Make invite link</button>

        <div id="invite-result" class="hidden" style="margin-top:1rem">
          <div class="linkbox" id="invite-url"></div>
          <button id="share-wa" class="big" type="button" data-s="share_whatsapp">Share on WhatsApp</button>
          <button id="copy-link" class="big ghost" type="button" data-s="copy_link">Copy link</button>
        </div>
      </div>

      <h3 data-s="open_invites">Invite links</h3>
      <div id="invites"></div>

      <h3 data-s="members">Your team</h3>
      <div id="members"></div>

      <h3 data-s="areas_admin">Areas</h3>
      <div id="areas-admin"></div>

      <div class="panel" style="margin-top:1rem">
        <h3 data-s="add_area">Add an area</h3>
        <label class="field">
          <span data-s="area_en">Name in English</span>
          <input id="new-en">
        </label>
        <label class="field">
          <span data-s="area_hi">नाम (हिंदी)</span>
          <input id="new-hi">
        </label>
        <label class="field">
          <span data-s="area_slug">Short id (permanent)</span>
          <input id="new-slug" autocapitalize="none" spellcheck="false">
          <small class="hint" data-s="area_slug_help"></small>
        </label>
        <button id="add-area" class="big" type="button" data-s="save_area">Add area</button>
      </div>
    </section>

    <div class="panel" style="margin-top:2rem">
      <h3 data-s="move_title_alt">New phone, or the Home Screen app?</h3>
      <p class="hint-p" data-s="move_help_alt"></p>
      <button id="move" class="big ghost" type="button" data-s="move_make">Move me to a new phone</button>
      <div id="move-result" class="hidden" style="margin-top:1rem">
        <div class="linkbox" id="move-url"></div>
        <p class="hint-p" data-s="move_warn"></p>
        <button id="move-share" class="big" type="button" data-s="share_whatsapp">Share on WhatsApp</button>
        <button id="move-copy" class="big ghost" type="button" data-s="copy_link">Copy link</button>
      </div>
    </div>

    <p style="margin-top:1.4rem">
      <button id="signout" class="big ghost" type="button" data-s="sign_out">Sign out of this phone</button>
    </p>
  </section>


  <div class="support">
    <p data-s="support_note"></p>
    <a href="https://buymeachai.ezee.li/anishmg" target="_blank" rel="noopener" data-s="support_chai">☕ Buy me a chai</a>
    <a href="https://ko-fi.com/P5P7BMO10" target="_blank" rel="noopener" data-s="support_kofi">♥ Ko-fi</a>
  </div>

  <div class="foot">
    <a href="/" data-s="subscribe_link">Subscribe instead</a>
    <span id="who"></span>
  </div>

</div>
<script type="module" src="/post.js"></script>
</body>
</html>
