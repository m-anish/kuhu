# kuhu service — Cloudflare Worker + D1 + static PWA assets.
name = "kuhu-app"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Keep the workers.dev hostname alive. NOTE: adding `routes` while this is
# absent silently DISABLES workers.dev — always set it explicitly.
workers_dev = true

# A Worker attaches to a hostname by a custom-domain binding, which also gets
# Cloudflare to issue a certificate for it. A hand-made CNAME to *.workers.dev
# does NOT do this — it resolves, then 522s, with no cert. One label deep on
# purpose: free-plan certificates don't cover app.kuhu.starstucklab.com.
routes = [
  { pattern = "kuhuapp.starstucklab.com", custom_domain = true }
]

# The PWA (both faces) is served from ./app; /api/* always hits the worker.
[assets]
directory = "./app"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Hourly: clear retained MQTT payloads whose window has passed, so a device
# booting next week isn't told about last Tuesday's cut.
[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "kuhu"
database_id = "a3385903-9243-4daf-b66e-3a60b5415685"

[vars]
# Raw uncompressed P-256 public key, base64url — from tools/gen-vapid.mjs.
VAPID_PUBLIC_KEY = "BIaOJBG89DrdxucRpIYUqgLBrYz9MhCzziUO2XeNlPZmz9GEzm5xkFB3DtbYwic7R6mQq6s-u6jpOPiMav4j6io"
VAPID_SUBJECT = "mailto:anishmg@umich.edu"

# Optional mirrors. Both are silently skipped while unset, which is how kuhu
# ships — the app works fully without either.
#
# Telegram: create a bot with @BotFather, add it to the channel as an admin,
# then set the channel here and the token as a secret (TELEGRAM_BOT_TOKEN).
TELEGRAM_CHAT_ID = "@kuhunotices"
#
# MQTT: retained publishes to kuhu/<area>/cuts, for gadgets that would rather
# be told than poll. Credentials are secrets (MQTT_USERNAME / MQTT_PASSWORD);
# the publisher account may publish to kuhu/# and nothing else, and devices get
# a separate subscribe-only account so a compromised gadget cannot invent an
# outage.
MQTT_URL = "mqtts://873b9eb4dfb34950ae071b38bca36844.s1.eu.hivemq.cloud:8883"

# Secrets (set with `wrangler secret put`):
#   VAPID_PRIVATE_JWK  — the private key JWK JSON from tools/gen-vapid.mjs
#   TELEGRAM_BOT_TOKEN — from @BotFather
#   MQTT_USERNAME / MQTT_PASSWORD — broker credentials
